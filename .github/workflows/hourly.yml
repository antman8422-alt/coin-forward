name: hourly-logger

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: coin-forward-logger
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 기록
        run: python forward_logger.py

      - name: 저장 (커밋)
        run: |
          git config user.name  "coin-forward-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data state report.md
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "log $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
